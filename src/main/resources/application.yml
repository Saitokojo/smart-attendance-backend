server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-attendance-backend

  datasource:
    # អាចកំណត់តាម Environment Variables ពេល Deploy ឬប្រើតម្លៃលំនាំដើមសម្រាប់ Local
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_attendance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ការកំណត់សុវត្ថិភាព JWT Token
application:
  security:
    jwt:
      # Secret Key ប្រវែង 256-bit (Base64/Hex) សម្រាប់ HMAC-SHA256 (អាច override តាម ENV: JWT_SECRET)
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      # រយៈពេលសុពលភាព Token (24 ម៉ោង = 86,400,000 milliseconds)
      expiration: ${JWT_EXPIRATION:86400000}
