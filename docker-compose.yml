version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: always
    environment:
      POSTGRES_DB: smart_attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Automatically initializes the 13 tables on container startup
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - attendance_net

  # 2. pgAdmin 4 Web GUI (for visual DB management at http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attendance_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bbu.edu.kh
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - attendance_net

  # 3. Spring Boot Backend Service (Optional: for containerized deployment)
  # backend:
  #   build: .
  #   container_name: attendance_backend
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_attendance_db
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: postgres
  #   depends_on:
  #     - postgres
  #   networks:
  #     - attendance_net

volumes:
  postgres_data:
    driver: local

networks:
  attendance_net:
    driver: bridge
