<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Battambang', 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arr1-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr1-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr1-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr1-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="40" y="25" width="1520" height="75" rx="14" fill="url(#headerGrad1)" filter="url(#shadow1)"/>
  <text x="800" y="58" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">DATA FLOW DIAGRAM (DFD) — LEVEL 1: DETAILED PROCESS DECOMPOSITION</text>
  <text x="800" y="83" text-anchor="middle" fill="#93c5fd" font-size="13">ការបំបែក Process 0.0 ទៅជា ៦ ដំណើរការស្នូល និង ៦ ឃ្លាំងទិន្នន័យ (Data Stores) — BBU IT THESIS</text>

  <!-- ================= EXTERNAL ENTITIES ================= -->
  <!-- Entity: Student (Left Top) -->
  <g transform="translate(50, 160)" filter="url(#shadow1)">
    <rect width="180" height="150" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect width="180" height="34" rx="14" fill="#0284c7"/>
    <rect y="20" width="180" height="14" fill="#0284c7"/>
    <text x="90" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
    <text x="90" y="65" text-anchor="middle" fill="#0284c7" font-size="26">👨‍🎓</text>
    <text x="90" y="98" text-anchor="middle" fill="#0c4a6e" font-size="14" font-weight="bold">និស្សិត (Student)</text>
    <text x="90" y="118" text-anchor="middle" fill="#0369a1" font-size="10.5">Mobile App Client</text>
    <text x="90" y="136" text-anchor="middle" fill="#64748b" font-size="9.5">QR, GPS, BLE, Biometric</text>
  </g>

  <!-- Entity: Teacher (Right Top) -->
  <g transform="translate(1370, 160)" filter="url(#shadow1)">
    <rect width="180" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect width="180" height="34" rx="14" fill="#16a34a"/>
    <rect y="20" width="180" height="14" fill="#16a34a"/>
    <text x="90" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
    <text x="90" y="65" text-anchor="middle" fill="#16a34a" font-size="26">👨‍🏫</text>
    <text x="90" y="98" text-anchor="middle" fill="#14532d" font-size="14" font-weight="bold">សាស្ត្រាចារ្យ (Teacher)</text>
    <text x="90" y="118" text-anchor="middle" fill="#15803d" font-size="10.5">Web Portal / Tablet</text>
    <text x="90" y="136" text-anchor="middle" fill="#64748b" font-size="9.5">Session, Dynamic QR, Roster</text>
  </g>

  <!-- Entity: Admin (Top Center) -->
  <g transform="translate(710, 130)" filter="url(#shadow1)">
    <rect width="200" height="90" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="200" height="28" rx="12" fill="#7c3aed"/>
    <rect y="16" width="200" height="12" fill="#7c3aed"/>
    <text x="100" y="18" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">EXTERNAL ENTITY</text>
    <text x="100" y="52" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">🏛️ ADMIN (ការិយាល័យសិក្សា)</text>
    <text x="100" y="74" text-anchor="middle" fill="#6d28d9" font-size="10">System Admin &amp; Registrar</text>
  </g>

  <!-- ================= 6 CORE PROCESSES ================= -->
  <!-- PROCESS 1.0: AUTH & DEVICE BINDING -->
  <g transform="translate(320, 240)" filter="url(#shadow1)">
    <circle r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">1.0</text>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">AUTH &amp; DEVICE</text>
    <text x="0" y="15" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">BINDING</text>
    <text x="0" y="34" text-anchor="middle" fill="#2563eb" font-size="9.5">ផ្ទៀងផ្ទាត់គណនី</text>
    <text x="0" y="48" text-anchor="middle" fill="#64748b" font-size="8.5">&amp; ចង UUID ម៉ាស៊ីន</text>
  </g>

  <!-- PROCESS 2.0: ACADEMIC & CLASS MANAGEMENT -->
  <g transform="translate(710, 290)" filter="url(#shadow1)">
    <circle r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">2.0</text>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">ACADEMIC &amp;</text>
    <text x="0" y="15" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">CLASS CONFIG</text>
    <text x="0" y="34" text-anchor="middle" fill="#2563eb" font-size="9.5">គ្រប់គ្រងថ្នាក់,</text>
    <text x="0" y="48" text-anchor="middle" fill="#64748b" font-size="8.5">បន្ទប់ &amp; Geofence</text>
  </g>

  <!-- PROCESS 3.0: SESSION & DYNAMIC QR -->
  <g transform="translate(1100, 240)" filter="url(#shadow1)">
    <circle r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">3.0</text>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">DYNAMIC QR</text>
    <text x="0" y="15" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">GENERATOR</text>
    <text x="0" y="34" text-anchor="middle" fill="#2563eb" font-size="9.5">បង្កើត Session &amp;</text>
    <text x="0" y="48" text-anchor="middle" fill="#64748b" font-size="8.5">បង្វិល QR 15 វិនាទី</text>
  </g>

  <!-- PROCESS 4.0: MULTI-FACTOR VERIFICATION ENGINE (Center Big Process) -->
  <g transform="translate(620, 570)" filter="url(#shadow1)">
    <circle r="85" fill="#f0f9ff" stroke="#0284c7" stroke-width="3.5"/>
    <text x="0" y="-45" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">4.0</text>
    <line x1="-65" y1="-32" x2="65" y2="-32" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" fill="#0c4a6e" font-size="13.5" font-weight="bold">MULTI-FACTOR</text>
    <text x="0" y="10" text-anchor="middle" fill="#0c4a6e" font-size="13.5" font-weight="bold">VERIFICATION</text>
    <text x="0" y="30" text-anchor="middle" fill="#0284c7" font-size="12" font-weight="600">ផ្ទៀងផ្ទាត់វត្តមានពហុកត្តា</text>
    <text x="0" y="50" text-anchor="middle" fill="#475569" font-size="9.5">QR Hash + GPS + BLE + Bio</text>
    <text x="0" y="66" text-anchor="middle" fill="#0369a1" font-size="9">7-Factor Pipeline</text>
  </g>

  <!-- PROCESS 5.0: LEAVE REQUEST & APPROVAL -->
  <g transform="translate(250, 750)" filter="url(#shadow1)">
    <circle r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">5.0</text>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">LEAVE REQUEST</text>
    <text x="0" y="15" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">&amp; APPROVAL</text>
    <text x="0" y="34" text-anchor="middle" fill="#2563eb" font-size="9.5">ស្នើសុំ &amp; អនុម័ត</text>
    <text x="0" y="48" text-anchor="middle" fill="#64748b" font-size="8.5">ច្បាប់ឈប់សម្រាក</text>
  </g>

  <!-- PROCESS 6.0: AUDIT & ANALYTICS -->
  <g transform="translate(1000, 750)" filter="url(#shadow1)">
    <circle r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="0" y="-30" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">6.0</text>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="0" y="-2" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">AUDIT LOGGING</text>
    <text x="0" y="15" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">&amp; ANALYTICS</text>
    <text x="0" y="34" text-anchor="middle" fill="#2563eb" font-size="9.5">កត់ត្រាសវនកម្ម</text>
    <text x="0" y="48" text-anchor="middle" fill="#64748b" font-size="8.5">&amp; របាយការណ៍ក្លែងបន្លំ</text>
  </g>

  <!-- ================= 6 DATA STORES ================= -->
  <!-- D1: USERS & ROLES -->
  <g transform="translate(140, 420)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="180" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D1</text>
    <text x="55" y="19" fill="#0f172a" font-size="11.5" font-weight="bold">users &amp; roles</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">គណនី, តួនាទី, Hash</text>
  </g>

  <!-- D2: DEVICES -->
  <g transform="translate(380, 420)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="180" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D2</text>
    <text x="55" y="19" fill="#0f172a" font-size="11.5" font-weight="bold">devices</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">ចង UUID ម៉ាស៊ីន (1:1)</text>
  </g>

  <!-- D3: CLASSES & ROOMS -->
  <g transform="translate(860, 420)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="190" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D3</text>
    <text x="55" y="19" fill="#0f172a" font-size="11" font-weight="bold">classes &amp; rooms</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">Geofence, GPS, BLE UUID</text>
  </g>

  <!-- D4: SESSIONS & SALTS -->
  <g transform="translate(1180, 420)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="190" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D4</text>
    <text x="55" y="19" fill="#0f172a" font-size="11" font-weight="bold">sessions &amp; salts</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">Dynamic QR Salt (15s)</text>
  </g>

  <!-- D5: ATTENDANCE RECORDS -->
  <g transform="translate(520, 890)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="220" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D5</text>
    <text x="55" y="19" fill="#0f172a" font-size="11" font-weight="bold">attendance_records</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">កាលបរិច្ឆេទ, ស្ថានភាព &amp; ភស្តុតាង</text>
  </g>

  <!-- D6: LEAVE & AUDIT LOGS -->
  <g transform="translate(860, 890)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#0284c7" stroke-width="2"/>
    <line x1="0" y1="42" x2="220" y2="42" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="1" width="45" height="40" fill="#e0f2fe"/>
    <text x="22" y="26" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">D6</text>
    <text x="55" y="19" fill="#0f172a" font-size="11" font-weight="bold">fraud_audit_logs</text>
    <text x="55" y="34" fill="#64748b" font-size="9.5">កត់ត្រាការបន្លំ GPS, Proxy</text>
  </g>

  <!-- ================= FLOW CONNECTORS ================= -->
  <!-- Student -> 1.0 (Login, UUID) -->
  <path d="M 230 220 L 255 220" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr1-b)"/>
  <text x="242" y="210" text-anchor="middle" fill="#0369a1" font-size="9">Credentials</text>

  <!-- 1.0 <-> D1 -->
  <path d="M 320 305 L 240 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>
  <!-- 1.0 <-> D2 -->
  <path d="M 350 305 L 430 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>

  <!-- Admin -> 2.0 -->
  <path d="M 810 220 L 810 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr1-p)"/>
  <!-- 2.0 -> D3 -->
  <path d="M 765 340 L 900 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>

  <!-- Teacher -> 3.0 -->
  <path d="M 1370 230 L 1165 230" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr1-g)"/>
  <text x="1270" y="220" text-anchor="middle" fill="#15803d" font-size="9.5">Start Session &amp; Salt</text>

  <!-- 3.0 -> Teacher (QR Code) -->
  <path d="M 1165 260 L 1370 260" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr1-g)"/>
  <text x="1270" y="280" text-anchor="middle" fill="#15803d" font-size="9.5">Dynamic QR Display</text>

  <!-- 3.0 <-> D4 -->
  <path d="M 1120 305 L 1220 420" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>

  <!-- Student -> 4.0 (Payload) -->
  <path d="M 140 310 L 140 570 L 535 570" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr1-b)"/>
  <text x="320" y="560" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="bold">Scan Payload: QR Hash + GPS + BLE + Biometric UUID</text>

  <!-- 4.0 reads D2 (Device binding) -->
  <path d="M 500 462 L 560 520" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>
  <!-- 4.0 reads D3 (Geofence specs) -->
  <path d="M 900 462 L 685 520" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>
  <!-- 4.0 reads D4 (Salt validity) -->
  <path d="M 1200 462 L 705 550" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>

  <!-- 4.0 writes D5 (Attendance record) -->
  <path d="M 620 655 L 620 890" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr1-b)"/>
  <text x="630" y="780" fill="#0369a1" font-size="10.5" font-weight="bold">Save Verified Record (Present/Late)</text>

  <!-- 4.0 writes D6 (Fraud logs if anomaly) -->
  <path d="M 700 640 L 920 890" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arr1-gray)"/>
  <text x="830" y="720" fill="#dc2626" font-size="10.5" font-weight="bold">Log Spoof/Anomaly Violation</text>

  <!-- 4.0 -> Student (Result) -->
  <path d="M 535 590 L 160 590 L 160 310" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr1-b)"/>
  <text x="320" y="610" text-anchor="middle" fill="#0369a1" font-size="10.5">Attendance Status (Success / Rejected)</text>

  <!-- Teacher reads D5 for Live Roster -->
  <path d="M 740 910 L 1460 910 L 1460 310" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr1-g)"/>
  <text x="1200" y="900" fill="#15803d" font-size="10.5" font-weight="bold">Real-time Class Roster Stream</text>

  <!-- Student -> 5.0 (Leave Request) -->
  <path d="M 100 310 L 100 750 L 185 750" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr1-b)"/>
  <text x="140" y="735" fill="#0369a1" font-size="9.5">Leave App + Medical PDF</text>

  <!-- 5.0 -> D5 & Teacher Approval -->
  <path d="M 315 750 L 520 890" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>
  <path d="M 280 815 L 280 850 L 1400 850 L 1400 310" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arr1-g)"/>
  <text x="400" y="840" fill="#15803d" font-size="9.5">Teacher Review &amp; Approval Notification</text>

  <!-- 6.0 reads D5, D6 -> Admin & Teacher -->
  <path d="M 960 815 L 960 890" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr1-gray)"/>
  <path d="M 1065 750 L 1440 750 L 1440 310" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr1-p)"/>
  <text x="1260" y="740" fill="#6d28d9" font-size="10" font-weight="bold">Weekly Attendance &amp; Anomaly Reports</text>

  <!-- Footer Information -->
  <rect x="40" y="1030" width="1520" height="95" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="1060" fill="#0f172a" font-size="12.5" font-weight="bold">📌 សេចក្តីពន្យល់សម្រាប់ការពារសារណា (DFD Level 1 Architecture Defense Note):</text>
  <text x="60" y="1085" fill="#475569" font-size="11.5">១. DFD Level 1 បង្ហាញពីការធ្វើដំណើរនៃទិន្នន័យយ៉ាងលម្អិតឆ្លងកាត់ ៦ Sub-processes និង ៦ Data Stores ដែលឆ្លុះបញ្ចាំងពី Controller និង Service ក្នុង Spring Boot។</text>
  <text x="60" y="1108" fill="#475569" font-size="11.5">២. Process 4.0 គឺជាបេះដូងនៃប្រព័ន្ធ (Verification Engine) ដែលទទួលទិន្នន័យពីនិស្សិត រួច Validate ទន្ទឹមគ្នាជាមួយ D2 (Device), D3 (Geofence), D4 (Salt) មុននឹងកត់ត្រាចូល D5 ឬ D6។</text>
