server:
  port: 8080

spring:
  application:
    name: smart-attendance-backend

  datasource:
    # កែប្រែឈ្មោះ host, port, db name ឬ password ឱ្យត្រូវតាមកុំព្យូទ័ររបស់មិត្ត
    url: jdbc:postgresql://localhost:5432/smart_attendance_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ការកំណត់សុវត្ថិភាព JWT Token
application:
  security:
    jwt:
      # Secret Key ប្រវែង 256-bit (Base64/Hex) សម្រាប់ HMAC-SHA256
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # រយៈពេលសុពលភាព Token (24 ម៉ោង = 86,400,000 milliseconds)
      expiration: 86400000